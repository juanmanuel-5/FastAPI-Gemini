<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Recetas con IA</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    input, button { font-size: 1rem; padding: .5rem; }
    .receta { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>🍳 Recetas con IA</h1>
  <input id="tipo" placeholder="p. ej. postres, cenas ligeras…">
  <button onclick="buscar()">Generar</button>
  <div id="resultado"></div>

  <script>
    async function buscar() {
      const tipo = document.getElementById("tipo").value;
      const cont = document.getElementById("resultado");
      cont.textContent = "Cocinando… ⏳";

      try {
        const resp = await fetch("http://127.0.0.1:8000/recetas/generar?tipo=" + encodeURIComponent(tipo));
        if (!resp.ok) throw new Error("Error " + resp.status);
        const recetas = await resp.json();

        cont.innerHTML = "";
        for (const r of recetas) {
          const div = document.createElement("div");
          div.className = "receta";
          // textContent (y no innerHTML) evita inyectar HTML malicioso
          const h = document.createElement("h3"); h.textContent = r.receta_nombre;
          const ul = document.createElement("ul");
          r.ingredientes.forEach(i => { const li = document.createElement("li"); li.textContent = i; ul.appendChild(li); });
          div.append(h, ul);
          cont.appendChild(div);
        }
      } catch (e) {
        cont.textContent = "😕 No se pudieron obtener recetas: " + e.message;
      }
    }
  </script>
</body>
</html>
